name: Test
on:
  pull_request:
    paths:
      - .github/**
      - src/**
      - "*.json"
      - vite.config.ts
  push:
    branches:
      - main
    paths:
      - .github/**
      - src/**
      - "*.json"
      - vite.config.ts

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm clean-install
      - run: npx biome ci .
      - run: npm run build

  test:
    name: node ${{ matrix.node }} / ${{ matrix.registry.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The two most recent LTS versions of Node.js.
        node: [22, 24]
        registry:
          - name: zot
            image: ghcr.io/project-zot/zot-minimal:v2.1.20
          - name: distribution
            image: ghcr.io/distribution/distribution:3.1.1

    services:
      registry:
        image: ${{ matrix.registry.image }}
        ports:
          - 5000:5000
        env:
          # distribution rejects a DELETE unless it is enabled; zot ignores it.
          REGISTRY_STORAGE_DELETE_ENABLED: "true"

    steps:
      - name: Map hostname for registry
        run: |
          echo "127.0.0.1 registry" | sudo tee -a /etc/hosts

      - name: Wait registry
        run: |
          for ((i=1; i<=30; i++)); do
              status_code=$(curl -o /dev/null -s -w "%{http_code}\n" "http://registry:5000/v2/" || true)
              if [ "$status_code" -eq 200 ]; then
                  exit 0
              fi

              sleep 1
          done
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - run: npm clean-install
      - run: npx playwright install --with-deps chromium
      - run: npm run test
        env:
          REGISTRY_DOMAIN: registry:5000
          REGISTRY_KIND: ${{ matrix.registry.name }}

      - name: Report Coverage
        if: matrix.node == 24 && matrix.registry.name == 'zot'
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage/lcov.info
