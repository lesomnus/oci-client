name: Test
on:
  pull_request:
    paths:
      - .github/**
      - src/**
      - "*.json"
      - vite.config.ts
  push:
    branches:
      - main
    paths:
      - .github/**
      - src/**
      - "*.json"
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm clean-install
      - run: npx biome ci .
      - run: npm run build

  test:
    name: node ${{ matrix.node }} / ${{ matrix.registry.kind }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The two most recent LTS versions of Node.js.
        node: [22, 24]
        registry:
          - kind: zot
            image: ghcr.io/project-zot/zot:v2.1.20
          - kind: distribution-v2
            image: registry:2.8.3
          - kind: distribution-v3
            image: ghcr.io/distribution/distribution:3.1.1

    steps:
      - uses: actions/checkout@v7

      # The registry is run as a step rather than as a service since zot needs
      # its config to be mounted, which is only there once it is checked out.
      # Neither the config nor the variable bothers the registry it is not for.
      - name: Run registry
        run: |
          echo "127.0.0.1 registry" | sudo tee -a /etc/hosts
          docker run --detach --name registry \
            --publish 5000:5000 \
            --env REGISTRY_STORAGE_DELETE_ENABLED=true \
            --volume "${{ github.workspace }}/.github/zot.json:/etc/zot/config.json:ro" \
            "${{ matrix.registry.image }}"

      - name: Wait registry
        run: |
          for ((i=1; i<=60; i++)); do
              status_code=$(curl -o /dev/null -s -w "%{http_code}\n" "http://registry:5000/v2/" || true)
              if [ "$status_code" -eq 200 ]; then
                  exit 0
              fi

              sleep 1
          done
          docker logs registry
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - run: npm clean-install
      - run: npx playwright install --with-deps chromium
      - run: npm run test
        env:
          REGISTRY_DOMAIN: registry:5000
          REGISTRY_KIND: ${{ matrix.registry.kind }}

      - name: Report Coverage
        if: matrix.node == 24 && matrix.registry.kind == 'zot'
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage/lcov.info
