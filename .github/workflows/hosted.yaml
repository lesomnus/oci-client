name: Hosted

# The registries that are actually out there are reached on a schedule rather
# than on every push: they are outside this repository, they are rate limited,
# and a pull request from a fork cannot read the secrets anyway.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # ghcr takes the token a workflow is given, so nothing has to be held for it.
  packages: write

jobs:
  hosted:
    name: hosted registries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm clean-install
      - name: Test
        run: npx vitest run --project node --coverage.enabled=false src/hosted.test.ts
        env:
          REGISTRY_HOSTED: "1"
          # Without them the tests that write, or read what is not public, are
          # skipped; the ones that read a public image still run.
          REGISTRY_HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY_GHCR_USERNAME: ${{ github.repository_owner }}
          REGISTRY_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
